# ============================================================
# LegalFlow AI API — Continuous Integration
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Code Quality ───────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/legalflow_test'

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ── Build Verification ─────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/legalflow_test'

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/legalflow_test'

      - name: Verify build output
        run: |
          echo "=== Checking build output ==="
          ls -la dist/
          echo "=== Checking for main.js ==="
          test -f dist/main.js && echo "✅ dist/main.js exists" || (echo "❌ dist/main.js NOT found" && exit 1)

  # ── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: legalflow-ai-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/legalflow_test
